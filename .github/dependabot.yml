# Dependency updates: every ecosystem below goes into one weekly PR (multi-ecosystem
# group). Versions younger than a week are skipped (cooldown); security updates
# come at once, in their own PRs.
version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Moscow
    commit-message:
      prefix: chore
      include: scope

updates:
  # npm workspaces: the root lockfile covers every package; the template has its own
  - package-ecosystem: npm
    directories: ['/', '/template']
    patterns: ['*']
    multi-ecosystem-group: dependencies
    versioning-strategy: increase
    cooldown:
      default-days: 7
    ignore:
      # TypeScript 7 waits for typescript-eslint support
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Types follow the Node LTS the services run on, not the newest Node
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /template
    patterns: ['*']
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7
    ignore:
      # Node LTS only: moving to the next one is a deliberate upgrade
      - dependency-name: node
        update-types: ['version-update:semver-major']
