name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these same checks before publishing
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    # A real Postgres for the tests that need one (@dirai-kit/pg migrations under a lock)
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
      - run: npm run lint
      - run: npm run format
      - run: npm run types
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:pw@127.0.0.1:5432/postgres
      - run: npm run build
      # The example imports the package by name, so it is checked against the build
      - run: npm run examples:types
      # The template people start new bots from must keep working with the kit
      - run: npm run template:check
      - run: npm run pack:check
