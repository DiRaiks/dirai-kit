name: Release

# Every push to main is analysed by multi-semantic-release, per package and only
# over the commits that touch it: fix → patch, feat → minor, feat! or BREAKING
# CHANGE → major. After the CI checks pass it tags each released package
# (`@dirai-kit/tg@1.6.0`), publishes it to npm with provenance over OIDC (npm
# trusted publishing, no token stored) and creates a GitHub Release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The same checks as CI (lint, format, types, tests, build, example, template,
  # package); nothing is published unless they pass
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: checks
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # npm publish also runs each package's prepublishOnly: lint, types, tests,
      # build and the package check
      - run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
