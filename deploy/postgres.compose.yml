# Postgres with a daily backup, for the services' deploy/compose.yml:
#
#   include:
#     - path: postgres.compose.yml
#       env_file: [.env, postgres.env]
#
# The shared deploy workflow uploads this file next to the service's compose.yml.
# postgres.env names the database (POSTGRES_NAME=football) and the dump files
# (BACKUP_PREFIX=football); .env holds POSTGRES_PASSWORD. Both services run only with
# COMPOSE_PROFILES=postgres; the app's DATABASE_URL is then
# postgres://<POSTGRES_NAME>:<POSTGRES_PASSWORD>@postgres:5432/<POSTGRES_NAME>.

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-18.6-alpine}
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_NAME:?set POSTGRES_NAME in postgres.env}
      POSTGRES_DB: ${POSTGRES_NAME}
      # The image refuses to start without it
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      # Postgres 18 keeps its data under /var/lib/postgresql/<version>
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # Over TCP: on first start the image runs a socket-only server to initialise the
      # database, which must not count as ready
      test:
        [
          'CMD',
          'pg_isready',
          '-h',
          '127.0.0.1',
          '-U',
          '${POSTGRES_NAME}',
          '-d',
          '${POSTGRES_NAME}',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # Daily dump of the database to ./backups, keeps BACKUP_KEEP_DAYS
  postgres-backup:
    image: postgres:${POSTGRES_VERSION:-18.6-alpine}
    profiles: [postgres]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_PREFIX: ${BACKUP_PREFIX:-${POSTGRES_NAME}}
      PGHOST: postgres
      PGUSER: ${POSTGRES_NAME}
      PGDATABASE: ${POSTGRES_NAME}
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - ./backups:/backup
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          file="/backup/$${BACKUP_PREFIX}-$$(date -u +%Y%m%dT%H%M%SZ).dump"
          if pg_dump --format=custom --file="$$file"; then
            echo "backup written: $$file"
            wait=86400
          else
            rm -f "$$file"
            # e.g. Postgres restarting: try again soon instead of in a day
            echo "backup failed, retrying in 5 minutes" >&2
            wait=300
          fi
          find /backup -name "$${BACKUP_PREFIX}-*.dump" -mtime +"$$BACKUP_KEEP_DAYS" -delete
          sleep "$$wait"
        done
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  postgres_data:
